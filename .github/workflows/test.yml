name: Tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements.lock
            requirements-dev.txt
      - run: pip install -r requirements.lock -r requirements-dev.txt
      - run: pytest -q
      - name: Build production image
        run: docker build -t timber-ci .
      - name: Fresh install and container replacement
        run: python tests/container_smoke.py timber-ci
