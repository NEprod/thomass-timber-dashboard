<h5 class="mb-3">Square Panelling Options</h5>

<div id="square-input-block" class="border p-3 rounded mb-4">
  <div class="row mb-3">
    <!-- Slat Thickness -->
    <div class="col-6">
      <label for="slat_thickness" class="form-label">Slat Thickness</label>
      <select id="slat_thickness" name="slat_thickness" class="form-select form-select-sm">
        <!-- Populated dynamically -->
      </select>
    </div>
    <!-- Slat Width -->
    <div class="col-6">
      <label for="slat_width" class="form-label">Slat Width</label>
      <select id="slat_width" name="slat_width" class="form-select form-select-sm">
        <option value="70">70mm</option>
        <option value="75">75mm</option>
        <option value="80">80mm</option>
        <option value="85">85mm</option>
        <option value="90">90mm</option>
        <option value="95">95mm</option>
        <option value="100" selected>100mm</option>
      </select>
    </div>
    <!-- Moulding Type -->
    <div class="col-12" id="moulding_group">
      <label for="moulding_type" class="form-label">Moulding Type</label>
      <select id="moulding_type" name="moulding_type" class="form-select form-select-sm">
        <!-- Will be dynamically filtered -->
      </select>
    </div>
    <!-- Ledge Type -->
    <div class="col-12" id="ledge_group">
      <label for="ledge_type" class="form-label">Ledge Type</label>
      <select id="ledge_type" name="ledge_type" class="form-select form-select-sm">
        <!-- Populated dynamically -->
      </select>
    </div>
  </div>
</div>
<script src="{{ url_for('static', filename='js/populate_thickness.js') }}"></script>
<script src="{{ url_for('static', filename='js/slat_width_defaults.js') }}"></script>
<script src="{{ url_for('static', filename='js/populate_moulding_options.js') }}"></script>
<script src="{{ url_for('static', filename='js/populate_ledge_options.js') }}"></script>
