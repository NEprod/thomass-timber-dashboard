{% extends 'base.html' %}{% from 'macros.html' import quote_table %}{% block content %}<div class="page-heading"><div><p class="eyebrow">YOUR WORK</p><h1>Quotations</h1></div><a class="button primary" href="{{ url_for('web.quote_new') }}">＋ New quotation</a></div><section class="card"><form class="filter" method="get"><label class="grow">Search customer or title<input name="q" value="{{ search }}" placeholder="Find a quotation…"></label><label>Status<select name="status"><option value="">All statuses</option>{% for s in statuses %}<option {{ 'selected' if s==selected_status }}>{{ s }}</option>{% endfor %}</select></label><button>Apply filters</button>{% if search or selected_status %}<a href="{{ url_for('web.quotes') }}">Clear</a>{% endif %}</form>{{ quote_table(quotes) }}</section>{% endblock %}
